<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<meta name="theme-color" content="#1f6e5c" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<title>Buuba — Resumen</title>
<style>
  :root {
    --paper: #eff3f6;
    --grid: #c9d6e3;
    --ink: #1b2a4a;
    --ink-soft: #3d4d6e;
    --pizarron: #1f6e5c;
    --pizarron-dark: #17594a;
    --lapiz: #e8a93c;
    --lapiz-dark: #c98a1b;
    --corrector: #c23b3b;
    --corrector-dark: #a13024;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
  }
  .contenedor {
    max-width: 480px;
    margin: 0 auto;
    padding: 24px 16px 40px;
  }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 4px;
  }
  .subtitulo {
    color: var(--ink-soft);
    font-size: 0.85rem;
    margin: 0 0 20px;
  }
  .tarjeta {
    background: white;
    border: 2px solid var(--grid);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 16px;
  }
  .semaforo-fila {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .circulo {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .circulo.verde { background: var(--pizarron); }
  .circulo.amarillo { background: var(--lapiz); }
  .circulo.rojo { background: var(--corrector); }
  .circulo.gris { background: var(--grid); }
  .semaforo-texto {
    font-weight: 600;
    font-size: 1.05rem;
  }
  .etiqueta {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .monto {
    font-size: 1.8rem;
    font-weight: 700;
  }
  .barra-fondo {
    background: var(--paper);
    border-radius: 999px;
    height: 14px;
    overflow: hidden;
    margin-top: 10px;
  }
  .barra-relleno {
    height: 100%;
    background: var(--pizarron);
    border-radius: 999px;
    transition: width 0.3s;
  }
  .barra-relleno.rojo { background: var(--corrector); }
  .barra-relleno.amarillo { background: var(--lapiz); }
  .pct-texto {
    font-size: 0.8rem;
    color: var(--ink-soft);
    margin-top: 6px;
  }
  .alertas-fila {
    display: flex;
    gap: 12px;
  }
  .chip {
    flex: 1;
    text-align: center;
    padding: 12px 8px;
    border-radius: 10px;
    background: var(--paper);
  }
  .chip .numero {
    font-size: 1.4rem;
    font-weight: 700;
  }
  .chip .numero.alerta {
    color: var(--corrector-dark);
  }
  .chip .desc {
    font-size: 0.75rem;
    color: var(--ink-soft);
  }
  .pie {
    text-align: center;
    color: var(--ink-soft);
    font-size: 0.78rem;
    margin-top: 12px;
  }
  #btn-refrescar {
    display: block;
    margin: 16px auto 0;
    background: var(--pizarron);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 10px 20px;
    font-size: 0.9rem;
    font-weight: 600;
  }
  #btn-refrescar:active { background: var(--pizarron-dark); }
  .estado-mensaje {
    text-align: center;
    color: var(--ink-soft);
    padding: 40px 0;
  }
  .oculto { display: none; }
  .campo {
    margin-bottom: 14px;
  }
  .campo label {
    display: block;
    font-size: 0.8rem;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }
  .campo input {
    width: 100%;
    padding: 10px 12px;
    border: 2px solid var(--grid);
    border-radius: 10px;
    font-size: 1rem;
    box-sizing: border-box;
  }
  #btn-login, #btn-logout {
    display: block;
    width: 100%;
    background: var(--pizarron);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 12px 20px;
    font-size: 0.95rem;
    font-weight: 600;
  }
  #btn-login:active { background: var(--pizarron-dark); }
  #btn-logout {
    width: auto;
    background: transparent;
    color: var(--ink-soft);
    font-weight: 500;
    text-decoration: underline;
    padding: 6px 0;
  }
  .error-login {
    color: var(--corrector-dark);
    font-size: 0.85rem;
    margin-top: 10px;
    text-align: center;
  }
  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
    overflow-x: auto;
  }
  .tab-btn {
    flex: 1;
    white-space: nowrap;
    background: white;
    border: 2px solid var(--grid);
    color: var(--ink-soft);
    border-radius: 10px;
    padding: 8px 10px;
    font-size: 0.82rem;
    font-weight: 600;
  }
  .tab-btn.activo {
    background: var(--pizarron);
    border-color: var(--pizarron);
    color: white;
  }
  .panel.oculto { display: none; }
  .buscador {
    width: 100%;
    padding: 10px 12px;
    border: 2px solid var(--grid);
    border-radius: 10px;
    font-size: 0.95rem;
    margin-bottom: 14px;
    box-sizing: border-box;
  }
  .fila-item {
    background: white;
    border: 2px solid var(--grid);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .fila-item .linea-1 {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    font-weight: 600;
  }
  .fila-item .linea-2 {
    display: flex;
    justify-content: space-between;
    color: var(--ink-soft);
    font-size: 0.82rem;
    margin-top: 4px;
  }
  .badge {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--paper);
    color: var(--ink-soft);
  }
  .badge.rojo {
    background: var(--corrector);
    color: white;
  }
  .panel-estado {
    text-align: center;
    color: var(--ink-soft);
    padding: 24px 0;
  }
</style>
</head>
<body>
  <div class="contenedor">
    <h1>Buuba</h1>
    <p class="subtitulo">Resumen del negocio</p>

    <div id="pantalla-login" class="tarjeta oculto">
      <form id="form-login">
        <div class="campo">
          <label for="login-email">Correo</label>
          <input type="email" id="login-email" autocomplete="username" required />
        </div>
        <div class="campo">
          <label for="login-password">Contraseña</label>
          <input type="password" id="login-password" autocomplete="current-password" required />
        </div>
        <button type="submit" id="btn-login">Entrar</button>
        <div id="error-login" class="error-login oculto"></div>
      </form>
    </div>

    <div id="cargando" class="estado-mensaje oculto">Cargando…</div>
    <div id="error" class="estado-mensaje oculto"></div>

    <div id="contenido" class="oculto">
      <div class="tabs">
        <button class="tab-btn activo" data-tab="resumen">Resumen</button>
        <button class="tab-btn" data-tab="catalogo">Catálogo</button>
        <button class="tab-btn" data-tab="compras">Compras</button>
        <button class="tab-btn" data-tab="ventas">Ventas</button>
      </div>

      <div id="panel-resumen" class="panel">
        <div class="tarjeta">
          <div class="etiqueta">Salud del mes</div>
          <div class="semaforo-fila">
            <div id="circulo-semaforo" class="circulo gris"></div>
            <div id="texto-semaforo" class="semaforo-texto">Sin configurar</div>
          </div>
        </div>

        <div class="tarjeta">
          <div class="etiqueta">Ventas de hoy</div>
          <div id="ventas-hoy" class="monto">$0</div>
        </div>

        <div id="tarjeta-meta" class="tarjeta oculto">
          <div class="etiqueta">Meta del día</div>
          <div class="barra-fondo">
            <div id="barra-meta" class="barra-relleno" style="width: 0%"></div>
          </div>
          <div id="texto-meta" class="pct-texto"></div>
        </div>

        <div class="tarjeta">
          <div class="etiqueta">Alertas</div>
          <div class="alertas-fila">
            <div class="chip">
              <div id="num-quiebre" class="numero">0</div>
              <div class="desc">En quiebre</div>
            </div>
            <div class="chip">
              <div id="num-stock-bajo" class="numero">0</div>
              <div class="desc">Stock bajo</div>
            </div>
          </div>
        </div>
      </div>

      <div id="panel-catalogo" class="panel oculto">
        <input type="text" id="buscador-catalogo" class="buscador" placeholder="Buscar producto o categoría…" />
        <div id="lista-catalogo"></div>
      </div>

      <div id="panel-compras" class="panel oculto">
        <div id="lista-compras"></div>
      </div>

      <div id="panel-ventas" class="panel oculto">
        <div id="lista-ventas"></div>
      </div>

      <div id="actualizado" class="pie"></div>
      <button id="btn-logout">Cerrar sesión</button>
    </div>

    <button id="btn-refrescar" class="oculto">Actualizar</button>
  </div>

  <script>
    const SUPABASE_URL = "https://ozfylcauqhogfzfwhlkm.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_FXBLqB0Kw4bOlRaZzRiEog_-FtOU890";
    const CLAVE_SESION = "buuba_sesion_remota";

    const formatoMoneda = (valor) => `$${Math.round(Number(valor) || 0).toLocaleString("es-CL")}`;

    function textoTiempoRelativo(fechaISO) {
      const diffMs = Date.now() - new Date(fechaISO).getTime();
      const minutos = Math.round(diffMs / 60000);
      if (minutos < 1) return "hace instantes";
      if (minutos < 60) return `hace ${minutos} min`;
      const horas = Math.round(minutos / 60);
      return `hace ${horas} h`;
    }

    function obtenerSesion() {
      try {
        return JSON.parse(localStorage.getItem(CLAVE_SESION) || "null");
      } catch {
        return null;
      }
    }

    function guardarSesion(sesion) {
      localStorage.setItem(CLAVE_SESION, JSON.stringify(sesion));
    }

    function borrarSesion() {
      localStorage.removeItem(CLAVE_SESION);
    }

    function mostrarLogin(mensajeError) {
      document.getElementById("pantalla-login").classList.remove("oculto");
      document.getElementById("cargando").classList.add("oculto");
      document.getElementById("contenido").classList.add("oculto");
      document.getElementById("error").classList.add("oculto");
      document.getElementById("btn-refrescar").classList.add("oculto");
      const errorLogin = document.getElementById("error-login");
      if (mensajeError) {
        errorLogin.textContent = mensajeError;
        errorLogin.classList.remove("oculto");
      } else {
        errorLogin.classList.add("oculto");
      }
    }

    async function iniciarSesion(email, password) {
      const respuesta = await fetch(
        `${SUPABASE_URL}/auth/v1/token?grant_type=password`,
        {
          method: "POST",
          headers: {
            apikey: SUPABASE_ANON_KEY,
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ email, password }),
        }
      );
      const datos = await respuesta.json();
      if (!respuesta.ok) {
        throw new Error(
          datos.error_description || datos.msg || "Correo o contraseña incorrectos."
        );
      }
      guardarSesion({ access_token: datos.access_token, refresh_token: datos.refresh_token });
    }

    async function refrescarSesion(refreshToken) {
      const respuesta = await fetch(
        `${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`,
        {
          method: "POST",
          headers: {
            apikey: SUPABASE_ANON_KEY,
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ refresh_token: refreshToken }),
        }
      );
      const datos = await respuesta.json();
      if (!respuesta.ok) throw new Error("Sesión vencida");
      guardarSesion({ access_token: datos.access_token, refresh_token: datos.refresh_token });
      return datos.access_token;
    }

    async function fetchAutenticado(rutaConsulta) {
      const sesion = obtenerSesion();
      if (!sesion) throw new Error("SIN_SESION");

      const hacerFetch = (token) =>
        fetch(`${SUPABASE_URL}/rest/v1/${rutaConsulta}`, {
          headers: {
            apikey: SUPABASE_ANON_KEY,
            Authorization: `Bearer ${token}`,
          },
        });

      let respuesta = await hacerFetch(sesion.access_token);
      if (respuesta.status === 401) {
        const nuevoToken = await refrescarSesion(sesion.refresh_token);
        respuesta = await hacerFetch(nuevoToken);
      }
      if (!respuesta.ok) throw new Error(`Error del servidor (${respuesta.status})`);
      return respuesta.json();
    }

    let catalogoCache = [];

    async function cargarResumen() {
      const sesion = obtenerSesion();
      if (!sesion) {
        mostrarLogin();
        return;
      }

      document.getElementById("pantalla-login").classList.add("oculto");
      const cargando = document.getElementById("cargando");
      const error = document.getElementById("error");
      const contenido = document.getElementById("contenido");
      const btnRefrescar = document.getElementById("btn-refrescar");

      cargando.classList.remove("oculto");
      error.classList.add("oculto");

      try {
        const filas = await fetchAutenticado("resumen_negocio?select=*&id=eq.1");
        if (!filas.length) throw new Error("Todavía no hay datos sincronizados.");

        const datos = filas[0];

        const circulo = document.getElementById("circulo-semaforo");
        const textoSemaforo = document.getElementById("texto-semaforo");
        const colores = {
          verde: "Buen ritmo este mes",
          amarillo: "Cerca del punto de equilibrio",
          rojo: "Bajo el punto de equilibrio",
        };
        circulo.className = `circulo ${datos.semaforo || "gris"}`;
        textoSemaforo.textContent = datos.semaforo ? colores[datos.semaforo] : "Sin configurar";

        document.getElementById("ventas-hoy").textContent = formatoMoneda(datos.ventas_hoy);

        const tarjetaMeta = document.getElementById("tarjeta-meta");
        if (datos.meta_diaria) {
          tarjetaMeta.classList.remove("oculto");
          const pct = Math.min(100, datos.pct_avance_meta || 0);
          const barra = document.getElementById("barra-meta");
          barra.style.width = `${pct}%`;
          barra.className = `barra-relleno ${pct >= 100 ? "" : pct >= 50 ? "amarillo" : "rojo"}`;
          document.getElementById("texto-meta").textContent =
            `${formatoMoneda(datos.ventas_hoy)} de ${formatoMoneda(datos.meta_diaria)} (${(datos.pct_avance_meta ?? 0).toFixed(1)}%)`;
        } else {
          tarjetaMeta.classList.add("oculto");
        }

        const alertas = datos.alertas || {};
        const numQuiebre = document.getElementById("num-quiebre");
        const numStockBajo = document.getElementById("num-stock-bajo");
        numQuiebre.textContent = alertas.quiebre ?? 0;
        numQuiebre.classList.toggle("alerta", (alertas.quiebre ?? 0) > 0);
        numStockBajo.textContent = alertas.stock_bajo ?? 0;
        numStockBajo.classList.toggle("alerta", (alertas.stock_bajo ?? 0) > 0);

        document.getElementById("actualizado").textContent =
          `Actualizado ${textoTiempoRelativo(datos.actualizado_en)}`;

        contenido.classList.remove("oculto");
        cargando.classList.add("oculto");
        btnRefrescar.classList.remove("oculto");
      } catch (err) {
        cargando.classList.add("oculto");
        contenido.classList.add("oculto");
        if (err.message === "Sesión vencida") {
          borrarSesion();
          mostrarLogin("Tu sesión venció, ingresa de nuevo.");
          return;
        }
        error.textContent = err.message || "No se pudo cargar el resumen.";
        error.classList.remove("oculto");
        btnRefrescar.classList.remove("oculto");
      }
    }

    function renderEstadoPanel(contenedor, mensaje) {
      contenedor.innerHTML = `<div class="panel-estado">${mensaje}</div>`;
    }

    async function manejarErrorPanel(err, contenedor, mensajeGenerico) {
      if (err.message === "SIN_SESION" || err.message === "Sesión vencida") {
        borrarSesion();
        mostrarLogin(err.message === "Sesión vencida" ? "Tu sesión venció, ingresa de nuevo." : undefined);
        return;
      }
      renderEstadoPanel(contenedor, err.message || mensajeGenerico);
    }

    function renderFilaCatalogo(producto) {
      const stockBajo = producto.stock_actual <= producto.stock_minimo;
      return `
        <div class="fila-item">
          <div class="linea-1">
            <span>${producto.nombre}</span>
            <span>${formatoMoneda(producto.precio_venta)}</span>
          </div>
          <div class="linea-2">
            <span>${producto.categoria_nombre || "—"}</span>
            <span class="badge ${stockBajo ? "rojo" : ""}">Stock: ${producto.stock_actual}</span>
          </div>
        </div>
      `;
    }

    function renderCatalogo(filtro) {
      const contenedor = document.getElementById("lista-catalogo");
      const texto = (filtro || "").trim().toLowerCase();
      const filas = texto
        ? catalogoCache.filter(
            (p) =>
              (p.nombre || "").toLowerCase().includes(texto) ||
              (p.categoria_nombre || "").toLowerCase().includes(texto)
          )
        : catalogoCache;

      if (!filas.length) {
        renderEstadoPanel(contenedor, "No hay productos que mostrar.");
        return;
      }
      contenedor.innerHTML = filas.map(renderFilaCatalogo).join("");
    }

    async function cargarCatalogo() {
      const contenedor = document.getElementById("lista-catalogo");
      renderEstadoPanel(contenedor, "Cargando…");
      try {
        catalogoCache = await fetchAutenticado("productos?select=*&activo=eq.true&order=nombre.asc");
        renderCatalogo(document.getElementById("buscador-catalogo").value);
      } catch (err) {
        await manejarErrorPanel(err, contenedor, "No se pudo cargar el catálogo.");
      }
    }

    async function cargarCompras() {
      const contenedor = document.getElementById("lista-compras");
      renderEstadoPanel(contenedor, "Cargando…");
      try {
        const compras = await fetchAutenticado(
          "compras?select=*&order=fecha_ingreso.desc,actualizado_en.desc&limit=90"
        );
        if (!compras.length) {
          renderEstadoPanel(contenedor, "Todavía no hay compras sincronizadas.");
          return;
        }
        contenedor.innerHTML = compras
          .map(
            (compra) => `
            <div class="fila-item">
              <div class="linea-1">
                <span>${compra.proveedor_nombre || "—"}</span>
                <span>${formatoMoneda(compra.monto_total)}</span>
              </div>
              <div class="linea-2">
                <span>Factura ${compra.numero_factura || "—"} · ${compra.fecha_ingreso || "—"}</span>
                <span>Ingresado: ${formatoMoneda(compra.monto_ingresado)}</span>
              </div>
            </div>
          `
          )
          .join("");
      } catch (err) {
        await manejarErrorPanel(err, contenedor, "No se pudo cargar las compras.");
      }
    }

    async function cargarVentas() {
      const contenedor = document.getElementById("lista-ventas");
      renderEstadoPanel(contenedor, "Cargando…");
      try {
        const ventas = await fetchAutenticado("ventas?select=*&order=fecha_hora.desc&limit=90");
        if (!ventas.length) {
          renderEstadoPanel(contenedor, "Todavía no hay ventas sincronizadas.");
          return;
        }
        contenedor.innerHTML = ventas
          .map(
            (venta) => `
            <div class="fila-item">
              <div class="linea-1">
                <span>${formatoMoneda(venta.total)}${venta.anulada ? ' <span class="badge rojo">Anulada</span>' : ""}</span>
                <span>${textoTiempoRelativo(venta.fecha_hora)}</span>
              </div>
              <div class="linea-2">
                <span>${venta.metodo_pago || "—"}${venta.segmento ? " · " + venta.segmento : ""}</span>
                <span>${venta.usuario_nombre || "—"}</span>
              </div>
            </div>
          `
          )
          .join("");
      } catch (err) {
        await manejarErrorPanel(err, contenedor, "No se pudo cargar las ventas.");
      }
    }

    const cargadoresPorPestana = {
      resumen: cargarResumen,
      catalogo: cargarCatalogo,
      compras: cargarCompras,
      ventas: cargarVentas,
    };
    let pestanaActiva = "resumen";

    function cambiarPestana(pestana) {
      pestanaActiva = pestana;
      document.querySelectorAll(".tab-btn").forEach((boton) => {
        boton.classList.toggle("activo", boton.dataset.tab === pestana);
      });
      document.querySelectorAll(".panel").forEach((panel) => {
        panel.classList.toggle("oculto", panel.id !== `panel-${pestana}`);
      });
      cargadoresPorPestana[pestana]();
    }

    document.querySelectorAll(".tab-btn").forEach((boton) => {
      boton.addEventListener("click", () => cambiarPestana(boton.dataset.tab));
    });

    document.getElementById("buscador-catalogo").addEventListener("input", (evento) => {
      renderCatalogo(evento.target.value);
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }

    document.getElementById("form-login").addEventListener("submit", async (evento) => {
      evento.preventDefault();
      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value;
      const btnLogin = document.getElementById("btn-login");
      btnLogin.disabled = true;
      btnLogin.textContent = "Entrando…";
      try {
        await iniciarSesion(email, password);
        cambiarPestana("resumen");
      } catch (err) {
        mostrarLogin(err.message || "No se pudo iniciar sesión.");
      } finally {
        btnLogin.disabled = false;
        btnLogin.textContent = "Entrar";
      }
    });

    document.getElementById("btn-logout").addEventListener("click", () => {
      borrarSesion();
      cambiarPestana("resumen");
      mostrarLogin();
    });

    document.getElementById("btn-refrescar").addEventListener("click", () => cargadoresPorPestana[pestanaActiva]());
    cargarResumen();
    setInterval(() => cargadoresPorPestana[pestanaActiva](), 60000);
  </script>
</body>
</html>
